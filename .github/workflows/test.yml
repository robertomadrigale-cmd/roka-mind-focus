name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: |
          find public/js functions -name '*.js' -not -path '*/node_modules/*' -print0 |
            xargs -0 -n1 node --check
