<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Bienvenida al Mundial 2026 de Productos Rochin</title>
  <desc id="desc">Diseño cuadrado con tema futbolero, balón central y mensaje de bienvenida al Mundial 2026 para Productos Rochin.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063f34"/>
      <stop offset="0.45" stop-color="#0b6f4a"/>
      <stop offset="1" stop-color="#102f57"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#148947"/>
      <stop offset="0.5" stop-color="#20a75a"/>
      <stop offset="1" stop-color="#0d7445"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#fff4b6" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#ffd84e" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffd84e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001b16" flood-opacity="0.42"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001b16" flood-opacity="0.32"/>
    </filter>
    <pattern id="grass" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none"/>
      <path d="M0 80 L80 0" stroke="#ffffff" stroke-width="2" stroke-opacity="0.06"/>
      <path d="M-20 80 L80 -20" stroke="#001b16" stroke-width="2" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#sky)"/>
  <circle cx="540" cy="395" r="410" fill="url(#glow)"/>

  <g opacity="0.18">
    <path d="M0 180 C160 90 300 120 430 205 C575 298 710 312 1080 110 L1080 0 L0 0 Z" fill="#ffffff"/>
    <path d="M0 305 C180 205 340 235 492 328 C655 428 815 430 1080 245 L1080 170 C790 342 640 340 505 248 C340 136 178 110 0 220 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(0 36)" opacity="0.95">
    <rect x="84" y="74" width="86" height="18" rx="9" fill="#e5243f"/>
    <rect x="178" y="74" width="86" height="18" rx="9" fill="#ffffff"/>
    <rect x="272" y="74" width="86" height="18" rx="9" fill="#0f8a45"/>
    <rect x="722" y="74" width="64" height="18" rx="9" fill="#d0192d"/>
    <rect x="796" y="74" width="64" height="18" rx="9" fill="#ffffff"/>
    <rect x="870" y="74" width="64" height="18" rx="9" fill="#1c5aa6"/>
  </g>

  <g opacity="0.8" filter="url(#softShadow)">
    <circle cx="165" cy="225" r="9" fill="#ffd84e"/>
    <circle cx="920" cy="195" r="11" fill="#ff5f57"/>
    <circle cx="850" cy="330" r="7" fill="#5bd3ff"/>
    <circle cx="255" cy="365" r="8" fill="#ffffff"/>
    <rect x="119" y="330" width="36" height="12" rx="6" fill="#5bd3ff" transform="rotate(-18 137 336)"/>
    <rect x="874" y="415" width="44" height="13" rx="6.5" fill="#ffd84e" transform="rotate(19 896 421.5)"/>
    <rect x="220" y="164" width="38" height="13" rx="6.5" fill="#ff5f57" transform="rotate(22 239 170.5)"/>
    <rect x="716" y="232" width="35" height="11" rx="5.5" fill="#ffffff" transform="rotate(-25 733.5 237.5)"/>
  </g>

  <g text-anchor="middle" fill="#ffffff" filter="url(#softShadow)">
    <text x="540" y="188" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="4">PRODUCTOS ROCHIN</text>
    <rect x="335" y="215" width="410" height="5" rx="2.5" fill="#ffd84e"/>
  </g>

  <g text-anchor="middle" filter="url(#shadow)">
    <text x="540" y="325" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="76" font-weight="900" fill="#ffffff">BIENVENIDO</text>
    <text x="540" y="430" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="112" font-weight="900" fill="#ffd84e">MUNDIAL</text>
    <text x="540" y="532" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="118" font-weight="900" fill="#ffffff">2026</text>
  </g>

  <g transform="translate(540 655)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="128" fill="#ffffff"/>
    <circle cx="0" cy="0" r="126" fill="none" stroke="#dfe9e4" stroke-width="4"/>
    <polygon points="0,-56 53,-17 33,52 -33,52 -53,-17" fill="#101820"/>
    <path d="M0,-126 L0,-56 M120,-40 L53,-17 M75,102 L33,52 M-75,102 L-33,52 M-120,-40 L-53,-17" stroke="#101820" stroke-width="15" stroke-linecap="round"/>
    <path d="M-88,-88 L-53,-17 M88,-88 L53,-17 M-105,55 L-33,52 M105,55 L33,52" stroke="#101820" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-43" cy="-32" r="8" fill="#ffffff" opacity="0.42"/>
  </g>

  <g>
    <path d="M0 766 C160 696 320 720 435 778 C585 854 750 860 1080 724 L1080 1080 L0 1080 Z" fill="url(#field)"/>
    <path d="M0 766 C160 696 320 720 435 778 C585 854 750 860 1080 724" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.55"/>
    <rect y="760" width="1080" height="320" fill="url(#grass)" opacity="0.58"/>
    <path d="M120 938 H960" stroke="#ffffff" stroke-width="8" stroke-opacity="0.55" stroke-linecap="round"/>
    <circle cx="540" cy="938" r="105" fill="none" stroke="#ffffff" stroke-width="7" stroke-opacity="0.34"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="156" y="828" width="768" height="92" rx="46" fill="#ffffff" opacity="0.96"/>
    <text x="540" y="887" text-anchor="middle" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#063f34">Vivamos la pasión juntos</text>
  </g>

  <g text-anchor="middle" fill="#ffffff" filter="url(#softShadow)">
    <text x="540" y="1000" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Con la energía y sabor de PRODUCTOS ROCHIN</text>
  </g>
</svg>
